name: CI

# Gatilho: Pull Request para main ou develop.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Cancela execuções antigas do mesmo PR quando chega um novo commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Menor privilégio: só leitura por padrão.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  formatacao:
    name: 1. Análise de formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar formatação (Prettier)
        run: npm run format:check

  analise-estatica:
    name: 2. Análise estática de código
    needs: formatacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Análise estática (ESLint + typescript-eslint)
        run: npm run lint

  seguranca:
    name: 3. Análise estática de segurança
    needs: analise-estatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: SAST no código e auditoria de dependências
        run: |
          echo "== SAST: eslint-plugin-security (todas as regras como error) =="
          npm run security:sast
          echo "== Dependências de produção: npm audit (nível high) =="
          npm run security:deps

  build:
    name: 4. Build
    needs: seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Compilar TypeScript (tsc)
        run: |
          npm run build
          echo "Arquivos gerados em dist/:"
          ls -la dist
      - name: Publicar artefato dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  testes-unitarios:
    name: 5. Testes unitários
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes unitários (Jest)
        run: npm run test:unit

  testes-integracao:
    name: 6. Testes de integração
    needs: testes-unitarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: produtos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/produtos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes de integração (Jest + Supertest + PostgreSQL 16)
        run: npm run test:integration
      - name: Baixar artefato dist/ do job de build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Smoke test da aplicação compilada
        env:
          PORT: '3000'
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/health > /dev/null && break
            sleep 1
          done
          echo "GET /health"
          curl -fsS http://localhost:3000/health; echo
          echo "POST /produtos"
          curl -fsS -X POST http://localhost:3000/produtos \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Produto smoke test","preco":19.9,"estoque":5}'; echo
          echo "GET /produtos"
          curl -fsS http://localhost:3000/produtos; echo
          echo "Log do servidor:"
          cat server.log

  imagem:
    name: 7. Criação da imagem Docker
    needs: testes-integracao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Baixar artefato dist/ já testado (build once)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha
      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
